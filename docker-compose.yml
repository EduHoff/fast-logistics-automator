services:
  backend:
      build:
        context: ./backend
        args:
          - DATABASE_URL=${DATABASE_URL}
      container_name: backend
      env_file:
        - .env
      environment:
        - ROCKET_ADDRESS=0.0.0.0
        - ROCKET_PORT=8000
        - DATABASE_URL=${DATABASE_URL}
        - SECRET_TOKEN_KEY=${SECRET_TOKEN_KEY}
      ports:
        - "8000:8000"
      networks:
        - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend_target:

networks:
  app-network:
    driver: bridge
